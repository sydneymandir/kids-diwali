<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kids Diwali Celebration 2026 – Thank you</title>
<meta name="theme-color" content="#14112E">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 70% at 50% 0%,#2b2470 0%,#14112E 60%) fixed;color:#F5F2FF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
main{min-height:100svh;display:grid;place-items:center;padding:28px max(20px,env(safe-area-inset-left)) 28px max(20px,env(safe-area-inset-right));text-align:center}
.box{max-width:440px;width:100%}
.baps{height:56px;width:auto;opacity:.95}
.logo{width:min(320px,88%);height:auto;margin:18px auto 6px;display:block}
h1{font-size:1.6rem;line-height:1.2;margin:18px 0 8px;color:#F8C24B}
p{margin:0 0 10px;font-size:1.05rem;line-height:1.5;color:#E9E5FF}
.sp{color:#F8C24B;letter-spacing:.4em}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;margin-top:14px;border-radius:999px;background:linear-gradient(100deg,#F26B1D,#E8336E);color:#fff;font-weight:800;text-decoration:none;font-size:1.05rem}
.small{margin-top:14px;font-size:.88rem;color:#BDB7DE}
</style>
</head>
<body>
<main><div class="box">
  <img class="baps" src="baps-logo.webp" alt="BAPS" width="80" height="98">
  <img class="logo" src="kdc-logo.webp" alt="Kids Diwali Celebration 2026" width="800" height="279">
  <div class="sp" aria-hidden="true">✦ ✦ ✦</div>
  <h1>Kids Diwali 2026 has finished</h1>
  <p>Thank you for celebrating with us at BAPS Shri Swaminarayan Mandir, Sydney. Jay Swaminarayan!</p>
  <a class="go" id="go" href="https://www.baps.org/sydney">Go to BAPS Sydney</a>
  <p class="small" id="msg">Taking you to the BAPS Sydney page in <b id="n">6</b> seconds…</p>
</div></main>
<script>
/* remove the old offline guide (and its saved voice files) from this phone */
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(rs=>rs.filter(r=>r.scope.indexOf("/kids-diwali/")>=0).forEach(r=>r.unregister()))}catch(e){}   /* only the Kids Diwali one; the campus tour and Annakut guides keep theirs */
try{caches&&caches.keys().then(ks=>ks.filter(k=>k.indexOf("kids-diwali-")===0).forEach(k=>caches.delete(k)))}catch(e){}
try{["kdc.cq","kdc.dev","kdc.devday"].forEach(k=>localStorage.removeItem(k))}catch(e){}
/* then go to the BAPS Sydney page */
let n=6;const t=setInterval(()=>{n--;document.getElementById("n").textContent=n;if(n<=0){clearInterval(t);location.replace("https://www.baps.org/sydney")}},1000);
</script>
</body>
</html>
